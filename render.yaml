services:
  - type: web
    name: appointment-booking-api
    env: node
    buildCommand: cd backend && npm install && npx prisma generate && npm run build && npx prisma db push && npm run db:seed
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
